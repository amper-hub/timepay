name: MySQL 8.4 migration smoke test
# CI-only validation; migrate:fresh runs exclusively against the disposable service database.

on:
  pull_request:
    branches:
      - main
    paths:
      - "timepay-backend/**"
      - ".github/workflows/mysql-migration-smoke.yml"
  workflow_dispatch:

jobs:
  mysql-migrations:
    name: Fresh migrations on MySQL 8.4
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timepay-backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: timepay_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: timepay_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run all migrations against a disposable MySQL database
        run: php artisan migrate:fresh --force --no-interaction

      - name: Verify migration status
        run: php artisan migrate:status

      - name: Run existing automated test suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test
