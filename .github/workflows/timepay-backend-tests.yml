name: TimePay backend tests

on:
  pull_request:
    paths:
      - "timepay-backend/**"
      - ".github/workflows/timepay-backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "timepay-backend/**"
      - ".github/workflows/timepay-backend-tests.yml"

permissions:
  contents: read

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timepay-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: timepay-backend/package-lock.json

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run backend test suite
        run: php artisan test
